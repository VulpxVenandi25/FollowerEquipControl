[ui.controls.mod_key]
label=Tecla Mod
help=Establece la tecla que mantienes mientras comercias con un seguidor para activar las funciones del mod.


[ui.controls.skyui_equip_mode_key]
label=Anulación de la tecla de modo de equipamiento
help=Establece la tecla que mantienes mientras comercias con un seguidor para activar el Modo de equipamiento para el jugador.\n\nAnula el propio ajuste de tecla de Modo de equipamiento de SkyUI.\n\nEstablécelo en 'Desactivado' para usar la tecla de SkyUI.
none=Desactivado


[ui.controls.quick_trade_key]
label=Tecla de intercambio rápido
help=Establece la tecla modificadora que mantienes mientras pulsas Activar para abrir el menú de Intercambio rápido directamente con actores válidos.\n\nEstablécela en 'Tecla de esprintar' para usar la asignación de Esprintar del juego.
none=Tecla de esprintar


[ui.controls.gamepad_mod_key]
label=Tecla Mod
help=Establece el botón del mando usado como Tecla Mod mientras comercias con un seguidor.\n\nMantén este botón y pulsa otro para activar acciones del mod (por ejemplo, equipar mano derecha o mano izquierda).


[ui.controls.gamepad_right_hand_key]
label=Tecla de mano derecha
help=Establece el botón del mando para equipar con la mano derecha mientras se mantiene la Tecla Mod del mando.


[ui.controls.gamepad_left_hand_key]
label=Tecla de mano izquierda
help=Establece el botón del mando para equipar con la mano izquierda mientras se mantiene la Tecla Mod del mando.


[ui.controls.quick_trade_gamepad_key]
label=Tecla de intercambio rápido
help=Establece el botón modificador del mando que mantienes mientras pulsas Activar para abrir el menú de Intercambio rápido directamente con actores válidos.\n\nEstablécelo en 'Tecla de esprintar' para usar la asignación de Esprintar del juego.
none=Tecla de esprintar


[ui.controls.mod_key_indicator]
label=Indicador de la Tecla Mod
help=Añade un indicador de la Tecla Mod en la barra inferior de SkyUI mientras comercias con un seguidor.


[ui.controls.indicator_text]
label=Texto del indicador
; Default text shown in the editable text field.
default=Equipar seguidor
help=Establece el texto que se muestra en el indicador de la Tecla Mod en la barra inferior de SkyUI.


[ui.controls.inclusion_indicator_text]
label=Texto del indicador de incluidos
; Default text shown in the editable text field.
default=Equipar objetivo
help=Establece el texto que se muestra en el indicador de la Tecla Mod cuando el objetivo es un actor incluido en la lista. Déjalo vacío para usar el texto del indicador de seguidor.


[ui.controls.summon_indicator_text]
label=Texto del indicador de invocación
; Default text shown in the editable text field.
default=Equipar invocación
help=Establece el texto que se muestra en el indicador de la Tecla Mod cuando el objetivo es un actor invocado por el jugador. Déjalo vacío para usar el texto del indicador de seguidor.


[ui.controls.equip_mode_text_override]
label=Anulación del texto del modo de equipamiento
; Default text shown in the editable text field.
default=Equipar jugador
help=Anula la etiqueta de Modo de equipamiento en la barra inferior de SkyUI mientras comercias con un seguidor.\n\nSkyUI muestra su propio texto de Modo de equipamiento de forma predeterminada. Este ajuste te permite reemplazarlo con un texto personalizado. Déjalo vacío para usar el valor predeterminado localizado.


[ui.icon_appearance.enable_indicators]
label=Indicadores de icono
help=Activa los iconos del mod junto a los nombres de los objetos en el menú de intercambio.\n\nMientras comercias con un seguidor, aparecen iconos junto a los objetos que tienen una preferencia de combate, una preferencia de prenda para la cabeza, una selección de atuendo guardada o una selección de objeto de mano guardada. Los conmutadores de abajo controlan qué tipos de icono se muestran.


[ui.combat_equip.combat_preference_icon]
label=Iconos de preferencia de combate
help=Muestra un icono junto a los objetos de la lista de intercambio que están guardados como preferencias de combate.\n\nMientras comercias con un seguidor, las armas, los escudos y la munición que hayas guardado como preferencias de combate se marcan con un pequeño icono. Esto te permite ver qué objetos priorizará el seguidor para equipar en combate.


[ui.combat_equip.headgear_preference_icon]
label=Iconos de preferencia de prenda para la cabeza
help=Muestra un icono junto al objeto de cabeza de la lista de intercambio que está guardado como preferencia de prenda para la cabeza.\n\nMientras comercias con un seguidor, el casco, la capucha o el aro guardado como preferencia de prenda para la cabeza se marca con un pequeño icono. Esto te permite ver qué prenda para la cabeza equipará el seguidor al comenzar el combate.\n\nNota: Para cambiar la preferencia de prenda para la cabeza, mantén la Tecla Mod y pulsa equipar con la mano izquierda sobre el objeto de cabeza seleccionado.


[ui.outfit_sync.saved_outfit_item_icon]
label=Iconos de objetos de atuendo guardados
help=Muestra un icono junto a los objetos de atuendo de la lista de intercambio que están guardados para volver a equiparse.\n\nMientras comercias con un seguidor, los objetos de atuendo guardados se marcan con un pequeño icono. Esto te permite ver qué objetos de atuendo volverá a equipar el mod después de que el juego reconstruya el inventario del seguidor.


[ui.hand_item_restore.saved_hand_item_icon]
label=Iconos de objetos de mano guardados
help=Muestra un icono junto a las armas, escudos, pergaminos y munición guardados para volver a equiparse en la mano.\n\nMientras comercias con un seguidor, las selecciones guardadas de mano derecha, mano izquierda y munición se marcan con un pequeño icono. Esto te permite ver qué objetos de mano volverá a equipar el mod después de que el juego reconstruya el inventario del seguidor.


[ui.icon_appearance.enable_customization]
label=Personalización de iconos
help=Activa la personalización del tamaño y el espaciado de los iconos del mod. Cuando está desactivado, los iconos se muestran con el tamaño y el espaciado predeterminados.


[ui.icon_appearance.icon_size]
label=Tamaño del icono
help=Establece el tamaño de los iconos del mod que se muestran junto a los nombres de los objetos en el menú de intercambio.


[ui.icon_appearance.gap_after_text]
label=Separación tras el texto
help=Establece la separación horizontal entre el nombre del objeto y el primer icono del mod cuando no hay otros iconos.


[ui.icon_appearance.gap_after_icon]
label=Separación tras el icono
help=Establece la separación horizontal entre el icono situado más a la derecha que coloca SkyUI y el primer icono del mod.


[ui.icon_appearance.icon_spacing]
label=Espaciado de iconos
help=Establece la separación horizontal entre los iconos del mod cuando hay varios visibles en el mismo objeto.



; =============================================================================
; Modo de equipamiento
; =============================================================================


[ui.equip_mode.enable]
label=Activar equipamiento
help=Permite equipar objetos a los seguidores mientras comercias.\n\nMientras comercias con un seguidor, mantén la Tecla Mod y haz clic en un objeto para que lo equipe. Los conmutadores de abajo controlan qué tipos de objeto se pueden equipar de esta forma.


[ui.equip_mode.weapons]
label=Armas
help=Permite equipar armas a los seguidores.


[ui.equip_mode.armor]
label=Armadura
help=Permite equipar armaduras y escudos a los seguidores.


[ui.equip_mode.ammo]
label=Munición
help=Permite equipar munición (flechas y virotillos) a los seguidores.


[ui.equip_mode.torches]
label=Antorchas
help=Permite equipar antorchas a los seguidores.


[ui.equip_mode.scrolls]
label=Pergaminos
help=Permite equipar pergaminos a los seguidores.


[feedback.equip_mode]
; {0}=Follower name
