already_known={0} ya conoce {1}.



; =============================================================================
; Equipamiento de combate
; =============================================================================


[ui.combat_equip.equip_priority]
label=Prioridad de equipamiento
help=Da prioridad a las preferencias de combate guardadas cuando el juego decide qué debe equipar un seguidor en combate.\n\nEn combate, el juego decide periódicamente qué arma o escudo debe usar un seguidor y puede cambiarlo a objetos que no elegiste. Cuando este ajuste está activado, los objetos guardados como preferencias de combate se favorecen en esa decisión, por lo que es más probable que el seguidor luche con los objetos que seleccionaste.\n\nCuando el juego toma una decisión de arma, solo considera un número reducido de objetos del inventario del seguidor, así que tu preferencia puede no surtir efecto aunque el objeto que elegiste esté en el inventario del seguidor.\n\nEste ajuste puede influir en las decisiones de arma del juego, pero no puede controlar cuándo se producen ni a qué mano afectan. Si el juego nunca toma una decisión para una mano durante el combate, la preferencia de esa mano no puede aplicarse, lo que hace que el combate con dos armas no sea fiable. Para eso debes usar el ajuste Anulación de cuerpo a cuerpo en Anulaciones de equipamiento.


[ui.combat_equip.exact_item_match]
label=Coincidencia exacta de objeto
help=Hace que el seguidor use la copia exacta guardada de un objeto preferido, no solo cualquier copia del mismo tipo.\n\nUn seguidor puede llevar varias copias de la misma arma o escudo con distintos niveles de mejora o encantamientos, y el juego puede equipar cualquiera de ellas independientemente de cuál elegiste originalmente como preferencia. Con este ajuste activado, el seguidor usará la copia específica que guardaste siempre que equipe ese objeto.\n\nEsto también complementa a Prioridad de equipamiento: Prioridad de equipamiento solo coincide con el tipo de objeto base, por lo que el juego aún puede equipar la copia equivocada. Este ajuste cubre esa carencia asegurando que el seguidor use la copia exacta que guardaste.


[ui.combat_equip.clear_on_unequip]
label=Borrar preferencias al desequipar
help=Borra la preferencia guardada de un objeto cuando lo desequipas de un seguidor durante el intercambio.\n\nMientras comercias con un seguidor, desequipar un objeto no elimina automáticamente su preferencia guardada, por lo que el seguidor sigue teniendo una preferencia de combate para esa ranura. Cuando este ajuste está activado, desequipar un objeto también borra su preferencia, y el seguidor deja de tener una preferencia de combate para esa ranura.\n\nEste ajuste abarca todas las ranuras excepto la mano izquierda. Para borrar también las preferencias de mano izquierda al desequipar, activa Borrar preferencia de mano izquierda al desequipar.


[ui.combat_equip.clear_left_on_unequip]
label=Borrar preferencia de mano izquierda al desequipar
help=Borra la preferencia de mano izquierda cuando desequipas un objeto de mano izquierda de un seguidor durante el intercambio.\n\nMientras comercias con un seguidor, desequipar un objeto de mano izquierda no elimina automáticamente su preferencia guardada, por lo que el seguidor sigue teniendo una preferencia de combate para esa ranura. Cuando este ajuste está activado, quitar de la mano izquierda un arma de una mano, un escudo, un bastón o un pergamino también borra la preferencia de esa ranura.\n\nMantener esto separado de Borrar preferencias al desequipar te permite controlar cada mano de forma independiente. Por ejemplo, puedes borrar las preferencias de mano izquierda al desequipar para dejar la mano secundaria vacía a propósito, mientras las preferencias de arma de mano derecha no se ven afectadas.


[ui.combat_equip.melee_override]
label=Anulación de cuerpo a cuerpo
help=Obliga a los seguidores a usar las armas cuerpo a cuerpo y los escudos que seleccionaste para ellos.\n\nEn combate, la IA del juego puede cambiar el arma cuerpo a cuerpo o el escudo de un seguidor en cualquier momento. Este ajuste anula esos cambios y fuerza el equipamiento de tus selecciones, en lugar de solo influir en la decisión del juego como hace Prioridad de equipamiento. Solo se cubren las armas cuerpo a cuerpo y los escudos; forzar el equipamiento de armas a distancia, bastones o hechizos rompería la IA de combate del seguidor y evitaría que atacara.\n\nSe conserva la combinación exacta de manos que establezcas: arma a dos manos, una mano con escudo, dos armas, una mano con la otra vacía o incluso completamente desarmado. Si no hay ninguna preferencia guardada para una mano, o si el objeto preferido ya no está en el inventario del seguidor, el mod no actúa sobre esa mano, lo que permite al juego cambiar a algo que no elegiste (para forzar su desequipamiento, activa Forzar desarmado).


[ui.combat_equip.force_unarmed]
label=Forzar desarmado
help=Fuerza el desequipamiento de una mano que no tenga ninguna preferencia de combate guardada cuando el juego la equipe durante el combate.\n\nCuando Anulación de cuerpo a cuerpo está activa, el mod intenta equipar la preferencia guardada para cada mano. Si una mano no tiene ninguna preferencia establecida o su objeto preferido ya no está disponible, el mod normalmente no actúa sobre esa mano. Con este ajuste activado, el mod fuerza el desequipamiento de esa mano cuando el juego la equipe. Resulta muy útil cuando quieres una mano equipada con un arma y la otra vacía, o con mods de combate desarmado donde quieres una o ambas manos libres a propósito para atacar con los puños.


[ui.combat_equip.ammo_override]
label=Anulación de munición
help=Obliga a los seguidores a usar las flechas o virotillos que seleccionaste para ellos.\n\nEn combate, los seguidores pueden cambiar por su cuenta a una munición distinta, ignorando el tipo que elegiste. Este ajuste lo anula y hace que sigan usando tu selección durante todo el combate.\n\nSi la munición preferida se agota, el seguidor recurre a cualquier otra munición que tenga.


[ui.combat_equip.pre_combat_restore]
label=Restaurar equipamiento previo al combate
help=Restaura el equipamiento previo al combate del seguidor cuando este termina.\n\nDespués del combate, los seguidores siguen llevando el equipamiento al que cambiaron por última vez durante la pelea. Este ajuste restaura las armas, el escudo y la munición que tenían antes de la pelea, incluido vaciar cualquier mano que estuviera vacía antes de empezar el combate, para que no tengas que volver a equipar cada vez los objetos que quieres que usen. El seguidor permanece equipado con tus elecciones fuera del combate.


[ui.combat_equip.headgear_auto_equip]
label=Auto-equipar prenda para la cabeza
help=Equipa automáticamente la prenda para la cabeza que seleccionaste para un seguidor al comenzar el combate y restaura su estado previo al combate cuando este termina.\n\nFuera del combate, el seguidor puede ir con la cabeza descubierta o llevar otra prenda. Cuando empieza una pelea, el mod equipa la preferencia guardada automáticamente. Cuando el combate termina, su prenda para la cabeza vuelve a lo que llevaba antes, incluida la cabeza descubierta si ese era su estado. Se cubren cascos, capuchas y aros.\n\n- Para establecer una preferencia de prenda para la cabeza, abre el intercambio con el seguidor, selecciona un objeto de cabeza y pulsa la Tecla de mano izquierda mientras mantienes la Tecla Mod.\n- Para borrar o cambiar la preferencia, pulsa la misma combinación sobre el mismo objeto para borrarla, o sobre un objeto distinto para reemplazarla.


[ui.combat_equip.infinite_ammo]
label=Munición infinita
help=Evita que los seguidores consuman flechas o virotillos al disparar armas a distancia.\n\nCuando un seguidor dispara un arma a distancia, el juego elimina una pieza de munición de su inventario por disparo. Este ajuste evita esa eliminación, por lo que los seguidores nunca agotan su suministro. Aun así necesitan al menos una pieza de munición en su inventario para que el juego sepa qué tipo usar.



; =============================================================================
; Estabilidad de equipamiento
; =============================================================================


[ui.outfit_sync.block_outfit_reapplication]
label=Bloquear reaplicación del atuendo predeterminado
help=Evita que el juego vuelva a vestir al seguidor con su atuendo predeterminado.\n\nAl cargar una partida, viajar rápido o entrar en una zona nueva, el juego puede reemplazar los objetos equipados de un seguidor por su atuendo predeterminado original, descartando cualquier equipo personalizado que le hayas dado. Este ajuste bloquea ese reemplazo, por lo que el seguidor conserva el equipo que elegiste.


[ui.outfit_sync.reequip_saved_outfit_items]
label=Volver a equipar objetos de atuendo guardados
help=Vuelve a equipar los objetos de atuendo que elegiste para el seguidor después de que el juego le quite el atuendo.\n\nAl cargar una partida, viajar rápido o entrar en una zona nueva, el juego a veces quita por completo los objetos de atuendo que lleva un seguidor. Como Bloquear reaplicación del atuendo predeterminado impide que el juego restaure el atuendo predeterminado en esos momentos, el seguidor puede acabar sin llevar nada. Este ajuste vuelve a equipar tu selección de atuendo guardada para que el seguidor siga vestido como pretendías.


[ui.outfit_sync.allow_external_outfit_changes]
label=Permitir cambios externos de atuendo
help=Actualiza la selección de atuendo guardada cuando otro mod cambia el atuendo del seguidor.\n\nCuando Volver a equipar objetos de atuendo guardados está activado, este mod rastrea los objetos de atuendo que elegiste para el seguidor y los vuelve a equipar siempre que el juego los quita. Con este ajuste activado, si un mod cambia el atuendo del seguidor, ese cambio se acepta como la nueva selección guardada y se usa en todas las restauraciones futuras.\n\nCuando este ajuste está desactivado, el mod siempre vuelve a equipar tu atuendo guardado manualmente, ignorando los cambios hechos por otros mods.


[ui.hidden_items.non_playable]
label=Objetos no jugables
help=Elimina armaduras, armas y munición no jugables que están ocultas en el menú de intercambio cuando abres el intercambio con un seguidor.\n\nAlgunos objetos del inventario de un seguidor están marcados como no jugables. Estos objetos no aparecen en el menú de intercambio ni en el menú de inventario. Un seguidor puede llevar, equipar y usar estos objetos, pero desde el menú de intercambio no hay forma de saber que existen ni de cogerlos, quitarlos o cambiarlos. Con este ajuste activado, esos objetos ocultos se encuentran y se eliminan del inventario del seguidor cada vez que abres el intercambio con un seguidor. Esto garantiza que la lista de intercambio refleje con exactitud todo lo que lleva el seguidor, y que esos objetos ocultos ya no puedan provocar equipamientos o cambios de arma no deseados.\n\nAlgunos mods añaden objetos no jugables para uso interno, y eliminarlos podría romper esos mods. Los objetos sin modelo visible, los objetos generados por mods durante la partida y los objetos de misión nunca se eliminan para reducir este riesgo.


[ui.hidden_items.remove_hidden_armor]
label=Eliminar armadura oculta
help=Elimina piezas de armadura no jugables del inventario del seguidor cuando abres el intercambio con un seguidor.\n\nCuando está desactivado, la armadura oculta puede permanecer en el inventario del seguidor, pero nunca aparece en la lista de intercambio.\n\nAlgunos mods usan objetos no jugables para fines internos, y estos objetos se añaden con mayor frecuencia como piezas de armadura, por lo que este ajuste conlleva un riesgo de compatibilidad con mods mayor que los ajustes de armas o munición. Si un mod deja de funcionar correctamente para un seguidor tras activar esto, es probable que se haya eliminado un objeto necesario. Los objetos eliminados no se restauran si más adelante desactivas este ajuste. Para recuperar los objetos eliminados, carga una partida anterior a la activación de este ajuste.


[ui.hidden_items.remove_hidden_weapons]
label=Eliminar armas ocultas
help=Elimina armas y escudos no jugables del inventario del seguidor cuando abres el intercambio con un seguidor.\n\nCuando está desactivado, las armas y escudos ocultos pueden permanecer en el inventario del seguidor, pero nunca aparecen en la lista de intercambio.\n\nLos objetos eliminados no se restauran si más adelante desactivas este ajuste. Para recuperar los objetos eliminados, carga una partida anterior a la activación de este ajuste.


[ui.hidden_items.remove_hidden_ammo]
label=Eliminar munición oculta
help=Elimina munición no jugable del inventario del seguidor cuando abres el intercambio con un seguidor.\n\nCuando está desactivado, la munición oculta puede permanecer en el inventario del seguidor, pero nunca aparece en la lista de intercambio.\n\nLos objetos eliminados no se restauran si más adelante desactivas este ajuste. Para recuperar los objetos eliminados, carga una partida anterior a la activación de este ajuste.


[ui.hidden_items.outfit_items]
label=Objetos de atuendo
help=Hace visibles los objetos de atuendo ocultos en la lista de intercambio cuando comercias con un seguidor.\n\nAlgunas armaduras y prendas se asignan a un seguidor como su atuendo predeterminado. Estos objetos están ocultos en la lista de intercambio incluso mientras el seguidor los lleva puestos, por lo que no tienes forma de verlos, cogerlos ni cambiarlos. Además, mods como SPID que distribuyen objetos de atuendo a los seguidores usan el mismo sistema que el juego para ocultar los objetos de atuendo predeterminados, así que esos objetos distribuidos también están ocultos en la lista de intercambio aunque estén en el inventario del seguidor. Cuando está desactivado, esos objetos permanecen ocultos en la lista de intercambio y no puedes verlos, cogerlos ni gestionarlos.


[ui.hidden_items.reveal_default_outfit_items]
label=Revelar objetos del atuendo predeterminado
help=Hace visibles en la lista de intercambio las armaduras y prendas del atuendo predeterminado del seguidor cuando comercias con él.\n\nCuando abres el intercambio con un seguidor, las armaduras y prendas de su atuendo predeterminado están ocultas en la lista de intercambio incluso mientras el seguidor las lleva puestas. No tienes forma de ver, coger ni cambiar esas piezas que lleva porque nunca aparecen en la lista. Este ajuste las hace visibles para que puedas gestionarlas como cualquier otro objeto. Las copias de esas piezas de atuendo que el seguidor no lleva puestas también se eliminan, ya que son duplicados ocultos que no sirven para nada y ocupan peso de carga.


[ui.hidden_items.reveal_external_outfit_items]
label=Revelar objetos de atuendo externos
help=Hace visibles en la lista de intercambio los objetos de atuendo distribuidos al seguidor por mods cuando comercias con él.\n\nCuando abres el intercambio con un seguidor, los objetos de atuendo distribuidos por mods como SPID están ocultos en la lista de intercambio aunque estén en el inventario del seguidor. Estos mods usan el mismo sistema que el juego para ocultar los objetos de atuendo predeterminados al distribuir armaduras y prendas a los seguidores, por lo que esos objetos quedan ocultos en la lista de intercambio del mismo modo. Este ajuste hace visibles esos objetos en la lista de intercambio cuando abres el intercambio, para que puedas verlos, cogerlos o gestionarlos.


[ui.equip_suppression.block_outfit_injection]
label=Bloquear inyección de objetos de atuendo
help=Evita que el juego añada piezas de armadura del atuendo predeterminado de un seguidor a su inventario.\n\nCuando el juego aplica un atuendo nuevo a un seguidor, también añade las piezas de armadura de ese atuendo directamente al inventario del seguidor. Bloquear reaplicación del atuendo predeterminado en Sincronización de atuendo ya evita esto en la mayoría de las situaciones, pero cuando ese ajuste está desactivado, o cuando otro mod asigna al seguidor un atuendo distinto, esas adiciones de armadura pueden seguir produciéndose. Este ajuste bloquea esas adiciones y el inventario del seguidor contiene solo lo que le hayas dado.\n\nSi Permitir cambios externos de atuendo está activado, desactiva este ajuste para que la armadura de los atuendos asignados por otros mods se añada al inventario del seguidor según lo previsto.


[ui.equip_suppression.block_leveled_injection]
label=Bloquear inyección de objetos por nivel
help=Evita que el juego añada objetos al inventario de un seguidor desde sus listas por nivel.\n\nCuando se configura por primera vez el inventario de un seguidor, el juego selecciona armas, munición, pociones y otros objetos de listas que escalan con el nivel del jugador y los añade al inventario del seguidor. Estos objetos aparecen sin que tú los hayas colocado ahí. El mismo proceso también puede activarse cuando cambia el nivel del seguidor. Este ajuste bloquea ese proceso para que los seguidores solo lleven los objetos que les hayas dado.\n\nSi Permitir cambios externos de atuendo está activado, desactiva este ajuste. Algunos mods asignan atuendos activando un restablecimiento completo del inventario que también ejecuta la inyección de objetos por nivel, y bloquearla puede impedir que esos objetos de atuendo se añadan al inventario del seguidor.


[ui.equip_suppression.block_weapon_acquisition]
label=Bloquear adquisición de armas
help=Impide que los seguidores busquen y cojan armas durante el combate.\n\nEn combate, el juego puede decidir que un seguidor necesita un arma y ordenarle que busque una. El seguidor deja de enfrentarse a los enemigos, camina hasta un arma cercana en el suelo, en un contenedor o en un cadáver, y la recoge. Este ajuste evita que ocurra, por lo que el seguidor se queda en la pelea en lugar de alejarse para conseguir un arma.\n\nCuando este ajuste está desactivado, Bloquear saqueo y Bloquear recogida aún pueden interceptar la recogida o transferencia final durante el combate, pero solo después de que el seguidor ya haya dejado de luchar y haya caminado hasta el objeto.


[ui.equip_suppression.block_looting]
label=Bloquear saqueo
help=Impide que los seguidores saqueen objetos de contenedores y cadáveres.\n\nEl juego puede transferir objetos de un contenedor o cadáver cercano directamente al inventario de un seguidor sin ninguna acción visible. Este ajuste bloquea esas transferencias. Se cubren todos los tipos de objeto, y el bloqueo se aplica en todo momento, no solo durante el combate. Solo se bloquea el saqueo que hace el seguidor por su cuenta. El saqueo que tú les ordenas no se ve afectado.\n\nLos objetos que están sueltos en el suelo no se cubren con este ajuste. Usa Bloquear recogida para impedir que los seguidores cojan esos.


[ui.equip_suppression.block_pickup]
label=Bloquear recogida
help=Impide que los seguidores recojan objetos sueltos que están en el suelo.\n\nEl juego puede hacer que los seguidores caminen hasta objetos cercanos en el suelo y los recojan. Esto ocurre mientras te siguen o están inactivos en una zona, y también puede ocurrir durante el combate cuando Bloquear adquisición de armas está desactivado. Se cubren todos los tipos de objeto. Solo se bloquean las recogidas que hace el seguidor por su cuenta. Las recogidas que tú les ordenas no se ven afectadas.\n\nLos objetos en contenedores y en cadáveres no se cubren con este ajuste. Usa Bloquear saqueo para impedir que los seguidores cojan esos.


[ui.equip_suppression.block_non_combat_auto_equip]
label=Bloquear auto-equipamiento fuera de combate
help=Evita que los seguidores equipen automáticamente armas, escudos, pergaminos o munición fuera del combate.\n\nAl cambiar de zona o viajar rápido, el juego puede cambiar el arma, el escudo, el pergamino o la munición de un seguidor por algo que no elegiste. Este ajuste bloquea esos equipamientos automáticos para que el seguidor conserve los objetos que seleccionaste hasta el siguiente combate.


[ui.hand_item_restore.reequip_saved_hand_items]
label=Volver a equipar objetos de mano guardados
help=Vuelve a equipar las selecciones de mano derecha, mano izquierda y munición que guardaste para un seguidor después de que el juego le quite los objetos de mano.\n\nAl cargar una partida, viajar rápido o entrar en una zona nueva, el juego puede quitar los objetos de mano y la munición equipados de un seguidor. Este ajuste vuelve a equipar tu selección guardada de objetos de mano y munición para que el seguidor siga equipado con tus elecciones fuera del combate.


[ui.equip_suppression.block_best_weapon_auto_equip]
label=Bloquear auto-equipamiento de la mejor arma
help=Impide que el juego equipe automáticamente en el seguidor lo que considera su mejor arma durante el intercambio.\n\nMientras comercias con un seguidor, el juego puede equipar automáticamente un arma en el seguidor cada vez que se transfiere cualquier objeto, ya sea que estés dando o cogiendo objetos. Esto puede anular tus elecciones de equipo dentro de la misma sesión de intercambio. Este ajuste bloquea ese equipamiento automático de arma durante el resto de la sesión de intercambio, permitiéndote reorganizar objetos sin interferencias.


[ui.equip_gate.block_equip]
label=Bloquear equipamiento
help=Bloquea todos los equipamientos de objetos en seguidores que no realice este mod.\n\nLos ajustes específicos del mod cubren la mayoría de los escenarios conocidos que provocan cambios de equipo no deseados. Sin embargo, puede haber comportamientos del juego o cambios de otros mods que sigan provocando equipamientos no deseados. Este ajuste actúa como una red de seguridad amplia, bloqueando todos los equipamientos automáticos que no provengan de este mod y que ocurran fuera del combate. Los equipamientos durante el combate siempre se permiten.\n\nPuede entrar en conflicto con otros mods que gestionan el equipo de los seguidores. Actívalo solo si no usas esos mods, o si aceptas el riesgo de un comportamiento incoherente del equipo de los seguidores.


[ui.equip_gate.block_unequip]
label=Bloquear desequipamiento
help=Bloquea todos los desequipamientos de objetos en seguidores que no realice este mod.\n\nLos ajustes específicos del mod cubren la mayoría de los escenarios conocidos que provocan cambios de equipo no deseados. Sin embargo, puede haber comportamientos del juego o cambios de otros mods que sigan provocando desequipamientos no deseados. Este ajuste actúa como una red de seguridad amplia, bloqueando todos los desequipamientos automáticos que no provengan de este mod y que ocurran fuera del combate. Los desequipamientos durante el combate siempre se permiten.\n\nPuede entrar en conflicto con otros mods que gestionan el equipo de los seguidores. Actívalo solo si no usas esos mods, o si aceptas el riesgo de un comportamiento incoherente del equipo de los seguidores.


[ui.equip_gate.never_block_torch]
label=No bloquear nunca la antorcha
help=Permite a los seguidores equipar y desequipar antorchas cuando Bloquear equipamiento o Bloquear desequipamiento está activado.\n\nCuando Bloquear equipamiento o Bloquear desequipamiento está activado, se bloquean todos los equipamientos y desequipamientos automáticos fuera del combate, incluidas las antorchas. Este ajuste crea una excepción para las antorchas, de modo que los seguidores pueden seguir encendiéndolas y guardándolas cuando lo necesiten, mientras el resto de su equipo permanece protegido.



; =============================================================================
; Funciones extra
; =============================================================================


[ui.weapon_recharge.enable_recharge]
label=Activar recarga
help=Activa la recarga de armas encantadas mientras comercias con un seguidor.\n\nMientras comercias con un seguidor, selecciona un arma encantada y pulsa la Tecla de recarga para restaurar su carga. Puedes usar gemas de alma tanto de tu inventario como del inventario del seguidor para la recarga.


[ui.weapon_recharge.recharge_key]
label=Tecla de recarga
help=Establece la tecla usada para recargar armas encantadas mientras comercias con un seguidor.


[ui.weapon_recharge.gamepad_recharge_key]
label=Tecla de recarga del mando
help=Establece el botón del mando usado para recargar armas encantadas mientras comercias con un seguidor.\n\nEn mando, hay que mantener pulsada la Tecla Mod del mando mientras se pulsa la Tecla de recarga del mando.


[ui.weapon_recharge.enable_indicator]
label=Indicador de la Tecla de recarga
help=Añade un indicador de la Tecla de recarga en la barra inferior de SkyUI cuando hay un arma encantada seleccionada mientras comercias con un seguidor.


[ui.weapon_recharge.advanced_display]
label=Visualización avanzada de gemas de alma
help=Activa información adicional para cada gema de alma en el selector al recargar armas encantadas.\n\nAl recargar un arma, el selector de gemas de alma muestra las gemas disponibles. Con este ajuste activado, cada gema puede mostrar el alma que contiene, cuántas hay en el inventario y de qué inventario procede la gema. Los conmutadores de abajo controlan cada tipo de detalle por separado.


[ui.weapon_recharge.show_stack_count]
label=Cantidad en la pila
help=Muestra cuántas unidades hay de cada gema de alma en el inventario junto a cada gema en el selector.


[ui.weapon_recharge.contained_soul_mode]
label=Alma contenida
help=Controla cuándo se muestra el alma contenida de cada gema en el selector de gemas de alma.\n\nAl recargar un arma, el selector de gemas de alma muestra las gemas disponibles. Este ajuste controla si se muestra junto a la gema el alma que contiene cada una.\n\n- DESACTIVAR: No mostrar nunca el alma contenida.\n- SOLO INFERIOR: Mostrar solo cuando el alma contenida sea inferior a la capacidad de la gema.\n- SIEMPRE: Mostrar siempre el alma contenida.
; These values are visible option names for contained soul display.
disable=DESACTIVAR
lower_only=SOLO INFERIOR
always=SIEMPRE


[ui.weapon_recharge.source_tag]
label=Etiqueta de origen
help=Controla si las gemas de alma del selector se etiquetan según el inventario del que proceden.\n\nAl recargar un arma, el selector de gemas de alma puede mostrar gemas tanto de tu inventario como del del seguidor. Este ajuste controla si cada gema se etiqueta con su origen.\n\n- DESACTIVAR: No mostrar etiquetas de origen.\n- SEGUIDOR: Etiquetar solo las gemas del inventario del seguidor.\n- JUGADOR: Etiquetar solo las gemas de tu inventario.\n- AMBOS: Etiquetar las gemas de ambos inventarios.
; These values are visible option names for soul gem source tags.
disable=DESACTIVAR
follower=SEGUIDOR
player=JUGADOR
both=AMBOS


[ui.weapon_recharge.soul_gem_sorting]
label=Ordenación de gemas de alma
help=Controla cómo se ordenan las gemas de alma en el selector al recargar un arma.\n\n- POR NOMBRE: Ordena las gemas de alma alfabéticamente por nombre.\n- ALMA ASC: Ordena por nivel de alma contenida, de menor a mayor.\n- ALMA DESC: Ordena por nivel de alma contenida, de mayor a menor.
; These values are visible option names for soul gem sorting.
name=POR NOMBRE
soul_asc=ALMA ASC
soul_desc=ALMA DESC


[feedback.weapon_recharge]
no_items_to_charge_enchantment=No hay objetos para recargar el encantamiento


[ui.stats_display]
help=Controla dónde se muestran las estadísticas del seguidor mientras comercias con él.\n\nDurante el intercambio, SkyUI muestra las estadísticas del jugador en el panel inferior. Este ajuste reemplaza ese panel con el peso de carga, el oro y las barras de salud/magia/aguante del seguidor al comerciar con él.\n\n- SIEMPRE: Muestra las estadísticas del seguidor tanto en la pestaña Coger como en la de Dar.\n- LADO DEL SEGUIDOR: Muestra las estadísticas del seguidor solo en la pestaña Coger.\n- DESACTIVAR: Muestra solo las estadísticas del jugador, como de costumbre.
; These values are visible option names for follower stats display.
always=SIEMPRE
follower_side=LADO DEL SEGUIDOR
disable=DESACTIVAR


[ui.corpse_equip.enable]
label=Activar equipar cadáveres
help=Permite equipar y desequipar armaduras, armas y munición en cadáveres mientras saqueas.\n\nMientras saqueas un cadáver, mantén la Tecla Mod y haz clic en un objeto de armadura, arma o munición para equiparlo o desequiparlo en el cadáver.


[ui.corpse_equip.indicator_text]
label=Texto del indicador
; Default text shown in the editable text field.
default=Equipar cadáver
help=Establece el texto que se muestra en el indicador de la barra inferior al saquear un cadáver.



; =============================================================================
; Correcciones
; =============================================================================


[ui.stale_weight_cache.enable]
label=Corrección del peso atascado
help=Corrige un error por el que todos los objetos con peso de la pestaña Dar aparecen atenuados y no se pueden transferir a un seguidor.\n\nMientras comercias con un seguidor, si se eliminó un objeto del equipo predeterminado del seguidor sin reemplazarlo, el peso de carga del seguidor puede quedar atascado en un valor imposiblemente alto. El juego entonces lo trata como incapaz de cargar más, atenuando todos los objetos con peso de la pestaña Dar. Este ajuste corrige el peso de carga atascado cuando abres el intercambio con ese seguidor, restaurando el comportamiento normal de transferencia.


[ui.quantity_menu_blocker.enable]
label=Omitir aviso de cantidad
help=Oculta el aviso de cantidad al usar la Tecla Mod o el modo de equipamiento de SkyUI mientras comercias con un seguidor.\n\nMientras comercias con un seguidor, hacer clic en un objeto apilado con la Tecla Mod o en el modo de equipamiento de SkyUI normalmente abre un aviso de cantidad. Estas acciones siempre se aplican a un solo objeto, por lo que el aviso no sirve para nada. Este ajuste lo omite para que la acción se realice de inmediato.


[ui.zero_weight.enable]
label=Aviso de objetos sin peso
help=Fuerza la aparición del aviso de cantidad al coger objetos sin peso de un seguidor en la pestaña Coger.\n\nDurante el intercambio, SkyUI transfiere toda la pila de objetos sin peso (como oro o ganzúas) en la pestaña Coger sin mostrar un aviso de cantidad. Este ajuste añade el aviso mientras comercias con un seguidor para que puedas elegir la cantidad exacta que coger en lugar de recibir toda la pila.\n\nPara transferir una pila (por ejemplo, flechas) y equiparla en el seguidor en un solo paso, inicia la transferencia sin la Tecla Mod y luego mantén la Tecla Mod mientras confirmas el aviso de cantidad.
