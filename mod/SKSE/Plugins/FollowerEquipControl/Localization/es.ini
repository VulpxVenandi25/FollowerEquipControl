help=Esta página enumera todos los hechizos que conoce el seguidor seleccionado y te permite controlar cuáles puede usar en combate.\n\nCuando un seguidor tiene hechizos que no quieres que use en combate, selecciona el hechizo y pulsa OLVIDAR para retirarlo del uso activo. El seguidor dejará de lanzar ese hechizo y puedes pulsar RECORDAR en cualquier momento para restaurarlo.\n\nLos hechizos marcados como HECHIZO BASE están integrados en el personaje original del seguidor y no se pueden eliminar. OLVIDAR solo funciona con hechizos que obtuvo durante la partida.


