[ui.consumable.enable]
label=Activar consumo
help=Permite consumir objetos con los seguidores mientras comercias.\n\nMientras comercias con un seguidor, mantén la Tecla Mod y haz clic en un objeto compatible para que el seguidor lo consuma. Los conmutadores de abajo controlan qué tipos de objeto se pueden consumir de esta forma.


[ui.consumable.potions]
label=Pociones
help=Permite que los seguidores consuman pociones.


[ui.consumable.foods]
label=Comida
help=Permite que los seguidores consuman comida.


[ui.consumable.drinks]
label=Bebidas
help=Permite que los seguidores consuman bebidas.


[ui.consumable.ingredients]
label=Ingredientes
help=Permite que los seguidores consuman ingredientes.


[ui.consumable.discovery]
label=Descubrimiento de alquimia del jugador
help=Permite al jugador aprender efectos de alquimia cuando un seguidor consume ingredientes.\n\nCuando un seguidor consume un ingrediente, el jugador aprende su primer efecto de alquimia, igual que si lo comiera él mismo. De este modo, tus seguidores pueden ayudarte a descubrir nuevos efectos.


