[ui.poison]
help=Controla qué ocurre cuando haces clic en un veneno mientras mantienes la Tecla Mod durante el intercambio con un seguidor.\n\n- Aplicar: Aplica el veneno al arma equipada del seguidor\n- Consumir: El seguidor consume el veneno\n- Desactivar: Transfiere el veneno con normalidad
; These values are visible option names for poison behavior.
apply=APLICAR
consume=CONSUMIR
disable=DESACTIVAR


[ui.poison.stacking]
label=Acumulación de veneno
help=Acumula cargas adicionales en un arma ya envenenada cuando se vuelve a aplicar el mismo veneno.\n\nDe forma predeterminada, un arma que ya está envenenada no se puede envenenar de nuevo. Cuando este ajuste está activado, cada aplicación del mismo veneno añade cargas al arma. Ventajas como Veneno concentrado pueden afectar al número de cargas que se añaden por aplicación.


[ui.poison.max_charges]
label=Cargas máximas
help=Establece el número máximo de cargas de veneno que se pueden acumular en un arma.\n\nEspecifica cuántas cargas se pueden aplicar. Una vez alcanzado el límite, se bloquean las aplicaciones posteriores. Establécelo en SIN LÍMITE para permitir que las cargas se acumulen sin restricción.
