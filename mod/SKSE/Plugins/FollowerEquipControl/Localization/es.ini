; =============================================================================
; Alcance y acceso
; =============================================================================


[ui.actor_scope.affect_former_followers]
label=Antiguos seguidores
help=Extiende todas las funciones del mod a los seguidores despedidos y antiguos.\n\nEl mod sigue gestionando el equipo y las preferencias de estos seguidores incluso después de despedirlos. Sin este ajuste, solo se ven afectados los seguidores que están actualmente en tu grupo.


[ui.actor_scope.include_inclusion_actors]
label=Actores incluidos
help=Incluye en el alcance del mod a los actores que coincidan con el sistema de inclusión configurado.\n\nNo todos los mods de seguidores registran sus PNJ como miembros activos del grupo, por lo que el mod no los reconoce de forma predeterminada. El sistema de inclusión te permite especificar actores, palabras clave o facciones para que el mod los gestione como a cualquier otro seguidor. Esto permite a autores de mods y usuarios incluir a cualquier actor que quieran, no solo los de mods de seguidores.


[ui.actor_scope.include_player_summons]
label=Invocaciones del jugador
help=Incluye en el alcance del mod a todos los actores controlados por el jugador, como criaturas invocadas, cadáveres reanimados y actores similares controlados mediante los sistemas de órdenes de Skyrim.\n\nCuando está desactivado, el mod ignora por completo a estos actores.


[ui.quick_trade.enable]
label=Activar intercambio rápido
help=Permite abrir el menú de intercambio directamente sin pasar por un menú de diálogo.\n\nMantén la Tecla de intercambio rápido y pulsa Activar sobre un actor válido para abrir el menú de intercambio directamente, sin pasar por ningún diálogo. Resulta especialmente útil con mods que añaden actores sin una opción de diálogo de intercambio, o cuando quieres comerciar con un seguidor sin hablar con él. Cuando está desactivado, la tecla de acceso rápido de Intercambio rápido no hace nada y todas las interacciones pasan por el diálogo normal.


[ui.quick_trade.followers]
label=Seguidores
help=Activa el Intercambio rápido para los seguidores activos.\n\nMantén la Tecla de intercambio rápido y pulsa Activar sobre un seguidor que esté actualmente en tu grupo para abrir el menú de intercambio directamente en lugar del diálogo normal. Cuando está desactivado, el Intercambio rápido ignora a los seguidores activos.


[ui.quick_trade.former_followers]
label=Antiguos seguidores
help=Activa el Intercambio rápido para los antiguos seguidores.\n\nMantén la Tecla de intercambio rápido y pulsa Activar sobre un seguidor despedido para abrir el menú de intercambio directamente. Esto solo funciona mientras el ajuste Antiguos seguidores de Alcance de actores esté activado; de lo contrario, el Intercambio rápido ignora a los antiguos seguidores.


[ui.quick_trade.inclusion_actors]
label=Actores incluidos
help=Activa el Intercambio rápido para los Actores incluidos.\n\nMantén la Tecla de intercambio rápido y pulsa Activar sobre un actor añadido mediante el sistema de inclusión para abrir el menú de intercambio directamente. Esto solo funciona mientras el ajuste Actores incluidos de Alcance de actores esté activado.


[ui.quick_trade.player_summons]
label=Invocaciones del jugador
help=Activa el Intercambio rápido para los actores controlados por el jugador.\n\nMantén la Tecla de intercambio rápido y pulsa Activar sobre una invocación, un cadáver reanimado o un actor similar controlado por el jugador para abrir el menú de intercambio directamente. Esto solo funciona mientras el ajuste Invocaciones del jugador de Alcance de actores esté activado.\n\nLos objetos entregados a invocaciones espectrales o daédricas pueden perderse de forma permanente si la invocación muere antes de que puedas recuperarlos. Estos actores desaparecen junto con su inventario, así que evita dar objetos importantes a estas invocaciones.


[ui.quick_trade.non_humanoid_actors]
label=Actores no humanoides
help=Activa el Intercambio rápido para los actores no humanoides.\n\nMantén la Tecla de intercambio rápido y pulsa Activar sobre un actor no humanoide para abrir el menú de intercambio directamente. Esto solo abre el intercambio para transferir objetos; los sistemas de gestión de seguidores del mod no se aplican a estos actores.\n\nEjemplos típicos son criaturas reanimadas como lobos, trolls y arañas, así como actores invocados como atronachos, familiares y otras criaturas creadas mediante hechizos de conjuración. Los compañeros no humanoides personalizados, criaturas y otros actores añadidos por mods también se pueden usar mediante el Intercambio rápido.


[ui.quick_trade.mounts]
label=Monturas
help=Activa el Intercambio rápido para las monturas de tus seguidores y tu última montura usada.\n\nMantén la Tecla de intercambio rápido y pulsa Activar sobre las monturas para abrir el menú de intercambio. Esto solo abre el intercambio para transferir objetos; las funciones del mod no funcionan en estas monturas.\n\nLa última montura usada por el jugador se sigue rastreando tras desmontarse, pero las monturas de los seguidores solo se rastrean mientras se montan activamente, por lo que solo puedes usar el Intercambio rápido con la montura de un seguidor mientras este la está montando. Si quieres acceder a una montura que no cumpla estas condiciones, puedes usar el siguiente ajuste.


[ui.quick_trade.all_world_mounts]
label=Todas las monturas
help=Amplía el alcance del Intercambio rápido para abarcar todas las criaturas montables.\n\nMantén la Tecla de intercambio rápido y pulsa Activar sobre cualquier criatura montable para abrir el menú de intercambio. Si el Intercambio rápido no funciona con las monturas de tus seguidores o con tu propia montura debido a algún mod de monturas que uses, activa esto para ampliar la cobertura a todas las criaturas montables.\n\nSi está activado, el Intercambio rápido se puede usar con todos los caballos y criaturas montables. Esto incluye monturas en establos o propiedad de otros PNJ.



