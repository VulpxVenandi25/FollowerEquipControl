[ui.spell_tome.enable]
label=Activar aprendizaje
help=Permite a los seguidores aprender hechizos de tomos mientras comercias.\n\nMientras comercias con un seguidor, mantén la Tecla Mod y haz clic en un tomo de hechizo para que el seguidor aprenda su hechizo.


[ui.spell_tome.do_not_consume]
label=No consumir tomos de hechizo
help=Evita que los tomos de hechizo se consuman al enseñar hechizos a los seguidores.\n\nDe forma predeterminada, cuando un seguidor aprende un hechizo de un tomo, el tomo se consume y se elimina de tu inventario. Cuando este ajuste está activado, el seguidor sigue aprendiendo el hechizo, pero el tomo permanece en el inventario para que puedas enseñárselo a otros seguidores o quedártelo.


