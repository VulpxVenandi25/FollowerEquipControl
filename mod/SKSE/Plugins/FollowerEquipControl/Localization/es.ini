; =============================================================================
; Follower Equip Control - Localización en Español
; =============================================================================
;
; Este archivo controla el texto que muestra el Mod Control Panel de
; Follower Equip Control dentro del juego, así como sus notificaciones.
;
; Las líneas que comienzan con ; o # son comentarios y el mod las ignora.


; -------------------------------------------------------
; Flujo de traducción:
; -------------------------------------------------------
;
; - Copia este archivo y renombra la copia para tu idioma. Para los archivos de
;   traducción se puede usar cualquier nombre .ini excepto en.ini.
;
; - Traduce solo el texto que hay después del signo =. No renombres las
;   [secciones] ni las claves a la izquierda del =.
;   Ejemplo:
;     [ui.toolbar]
;     save=SAVE
;   Traduce SAVE, pero deja [ui.toolbar] y save sin cambios.


; -------------------------------------------------------
; Nombres de claves habituales:
; -------------------------------------------------------
;
; - label es el nombre corto del ajuste o control que se muestra en el menú.
;
; - help es la descripción larga que se muestra al pasar el cursor sobre el
;   icono de ayuda (?).
;
; - tooltip es el texto breve que aparece al pasar el cursor sobre botones o
;   controles pequeños.
;
; - default es el texto predeterminado que se muestra en los campos de texto
;   editables.


; -------------------------------------------------------
; Formato del texto:
; -------------------------------------------------------
;
; - Usa \n dentro de un valor para empezar una nueva línea en el juego. Resulta
;   útil para textos de ayuda y tooltips largos.
;
; - Usa \t dentro de un valor para insertar un tabulador en el juego. Puede
;   servir para una sangría simple.
;
; - Algunas cadenas contienen marcadores como {0}, {1} o {2}. Conserva todos
;   los marcadores de la cadena original. Puedes reordenarlos si tu idioma
;   necesita un orden distinto de las palabras.
;   Ejemplo:
;     {0} aprendió {1}
;     {1} fue aprendido por {0}.
;   Para mostrar una { o una } literal, escribe {{ o }}.


; -------------------------------------------------------
; Selección de idioma:
; -------------------------------------------------------
;
; - Coloca los archivos de traducción en:
;     Data/SKSE/Plugins/FollowerEquipControl/Localization
;
; - Si hay exactamente un archivo de traducción distinto de en.ini, el mod lo
;   carga automáticamente. En caso contrario, el mod usa en.ini. Si en.ini no
;   está disponible, se usa el texto en inglés integrado.
;
; - Si falta una clave, el mod usa el texto en inglés de en.ini o sus valores
;   predeterminados en inglés integrados.


; -------------------------------------------------------
; Codificación y soporte de fuentes:
; -------------------------------------------------------
;
; - Los archivos de traducción deben guardarse con codificación UTF-8, pero la
;   codificación UTF-8 por sí sola no basta si la fuente activa no admite el
;   idioma de destino.
;
; - Si los caracteres traducidos aparecen como ? en el juego, normalmente
;   significa que la fuente activa no contiene esos glifos.
;
; - SKSEMenuFramework.ini también incluye conmutadores de rangos de glifos como
;   EnableChinese, EnableJapanese, EnableKorean, EnableCyrillic, etc.
;   Estos añaden rangos de glifos adicionales para esas escrituras.



