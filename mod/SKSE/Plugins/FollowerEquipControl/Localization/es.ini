show=Mostrar referencia de borrado cruzado
help=Esta tabla es una referencia que muestra qué preferencias se borran automáticamente cuando se establece una nueva.\n\nUna X en una celda significa que establecer la preferencia de la fila borrará automáticamente la preferencia de la columna. Las preferencias del mismo grupo pueden entrar en conflicto, establecer una borra las demás incompatibles.\n\nElegir un arma a dos manos borra las preferencias de una mano y de escudo. Elegir un arma de mano izquierda o un escudo borra la otra ranura de mano izquierda y también borra la de dos manos. Elegir un arma de mano derecha solo borra la de dos manos.\n\nArco y Ballesta se borran mutuamente. Pergamino (derecha) y Pergamino (izquierda) borran Pergamino (2M), y Pergamino (2M) borra ambos.\n\nFlechas, Virotillos y Bastones nunca borran nada.



